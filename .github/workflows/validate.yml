name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML (sitemap & RSS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout sitemap.xml
          xmllint --noout feed.xml
          echo "XML validation passed"

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          blacklist: _partials template.html
          format: text

      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            --exclude 'linkedin\.com'
            --exclude 'substack\.com'
            -- '.'
          fail: true

      - name: Warn about large images
        run: |
          MAX_KB=100
          while IFS= read -r file; do
            size=$(du -k "$file" | cut -f1)
            if [ "$size" -gt "$MAX_KB" ]; then
              echo "WARNING: $file is ${size}KB — consider converting to WebP"
            fi
          done < <(find assets/ -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) ! -name 'profile.*')
